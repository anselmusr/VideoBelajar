# Blueprint Render untuk backend Express di server/.
# Pakai: Render Dashboard -> New -> Blueprint -> pilih repo ini -> pilih branch.
# Nilai ber-"sync: false" tidak disimpan di repo; Render menanyakannya sekali
# saat blueprint dibuat (kredensial Aiven & Brevo).
services:
  - type: web
    name: videobelajar-api
    runtime: node
    # region Asia: setiap request memanggil MySQL, jadi API sebaiknya dekat database
    region: singapore
    plan: free
    buildCommand: npm install
    startCommand: npm run server
    # GET / mengembalikan daftar endpoint, cocok dipakai health check
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      # origin FRONTEND — tautan verifikasi di email mengarah ke halaman /verify-email
      - key: APP_URL
        value: https://video-belajar.anselmusr.com
      # Kredensial MySQL Aiven (dashboard Aiven -> Connection information)
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      # isi lengkap ca.pem; Aiven mewajibkan TLS
      - key: DB_SSL_CA
        sync: false
      # dibuatkan Render sekali, tidak perlu dikarang sendiri
      - key: JWT_SECRET
        generateValue: true
      # Free tier Render memblokir port SMTP (25/465/587) sejak September 2025,
      # jadi email dikirim lewat API HTTPS Brevo. Ambil di Brevo -> SMTP & API
      # -> tab "API Keys" (BUKAN SMTP key). Tanpa ini server menolak start.
      - key: BREVO_API_KEY
        sync: false
      # alamat pengirim yang sudah diverifikasi di Brevo
      - key: MAIL_FROM
        sync: false
